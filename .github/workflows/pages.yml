name: Deploy to GitHub Pages

# The app is fully static, so it publishes straight to Pages at no cost.
#
# ONE-TIME SETUP: GitHub Pages must be switched on for this repository first --
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# A workflow cannot do this for you. Creating a Pages site needs admin scope,
# which the automatic GITHUB_TOKEN does not have even with `pages: write`, so
# `actions/configure-pages` with `enablement: true` fails with
# "Resource not accessible by integration". Once the source is set, every push
# to main publishes automatically and no further setup is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        working-directory: apps/web
        env:
          STATIC_EXPORT: 'true'
          # A project site is served from /<repo>, so assets need that prefix.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
