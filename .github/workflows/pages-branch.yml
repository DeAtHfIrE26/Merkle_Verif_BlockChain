name: Publish gh-pages branch

# Second, independent route to a live site.
#
# pages.yml is the preferred route, but it needs Settings -> Pages -> Source
# set to "GitHub Actions", and `actions/configure-pages` hard-fails until that
# happens. This workflow needs no Pages API at all: it builds the static export
# and commits it to the `gh-pages` branch with the ordinary contents:write
# token. The repository owner then only has to point
# Settings -> Pages -> Branch at `gh-pages` / `(root)`, which is the same
# "Deploy from a branch" source the repository already has selected.
#
# Only one Pages source can be active at a time, so the two workflows cannot
# fight over the live site. Whichever source is selected wins; the other route
# just keeps its artifact current.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Build static export
        run: npm run build
        working-directory: src/apps/web
        env:
          STATIC_EXPORT: 'true'
          # A project site is served from /<repo>, so assets need that prefix.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Replace the published site
        run: |
          set -euo pipefail
          # Wipe the tracked contents but keep .git, then lay down the new export.
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r src/apps/web/out/. site/
          # Pages runs Jekyll on branch sources, and Jekyll drops _next/.
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Static export is unchanged; nothing to publish.'
            exit 0
          fi
          git commit -m "chore(pages): publish static export from ${GITHUB_SHA::7}"
          git push origin gh-pages
